name: Lighthouse CI

on:
  schedule:
    - cron: '41 5 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install pnpm
        run: corepack prepare pnpm@10.18.2 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check measurement integrity
        run: pnpm cwv:check

      - name: Run Lighthouse (home)
        run: pnpm --dir frontend run lighthouse:home

      - name: Run Lighthouse (examples)
        run: pnpm --dir frontend run lighthouse:examples

      - name: Run Lighthouse (models-veo)
        run: pnpm --dir frontend run lighthouse:models-veo

      - name: Run Lighthouse (pricing)
        run: pnpm --dir frontend run lighthouse:pricing

      - name: Run Lighthouse (blog)
        run: pnpm --dir frontend run lighthouse:blog

      - name: Run Lighthouse (contact)
        run: pnpm --dir frontend run lighthouse:contact

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lighthouse-reports
          path: frontend/lighthouse-reports/**
