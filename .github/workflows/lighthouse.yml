name: Lighthouse CI

on:
  schedule:
    - cron: '41 5 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install pnpm
        run: corepack prepare pnpm@10.18.2 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check measurement integrity
        run: pnpm cwv:check

      - name: Collect Exemples diagnostic traces
        working-directory: frontend
        run: |
          mkdir -p lighthouse-reports/examples-diagnostics
          for run in 1 2 3 4 5; do
            pnpm exec lighthouse https://maxvideoai.com/examples --chrome-flags="--headless=new" --output=json --output-path="lighthouse-reports/examples-diagnostics/run-${run}.json" --save-assets
          done

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lighthouse-reports
          path: frontend/lighthouse-reports/**
