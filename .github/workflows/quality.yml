name: Quality CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality:
    name: Quality CI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      RUNTIME_AUDIT_DATABASE_URL: ${{ secrets.RUNTIME_AUDIT_DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install pnpm
        run: corepack prepare pnpm@10.18.2 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check public secret exposure
        run: pnpm run lint:exposure

      - name: Build engine catalog
        run: pnpm run engine:catalog

      - name: Check model roster drift
        run: pnpm run model:generate

      - name: Audit model datasets
        run: pnpm run models:audit

      - name: Audit runtime overrides (non-blocking)
        if: ${{ env.RUNTIME_AUDIT_DATABASE_URL != '' }}
        env:
          DATABASE_URL: ${{ env.RUNTIME_AUDIT_DATABASE_URL }}
        run: pnpm run models:audit --runtime
        continue-on-error: true

      - name: Check sources quality (warn-only)
        run: pnpm run sources:check
        continue-on-error: true

      - name: Type check (frontend)
        run: pnpm --dir frontend exec tsc --noEmit

      - name: Lint (frontend)
        run: pnpm --dir frontend run lint

      - name: Alt quality check (frontend)
        run: pnpm --dir frontend run qa:image-alt

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Install media and database validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install --yes --no-install-recommends postgresql-17
          echo '/usr/lib/postgresql/17/bin' >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/postgres --version
          ffmpeg -hide_banner -version

      - name: Validate tests
        run: pnpm run test:validate

      - name: Smoke test admin
        env:
          DATABASE_URL: ${{ env.RUNTIME_AUDIT_DATABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: pnpm run test:admin-smoke

      - name: Upload Playwright admin report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-admin-report
          path: output/playwright/**
