name: Gallery final paired Lighthouse comparison

on:
  # workflow_dispatch is unavailable until this file reaches the default branch.
  # The scoped branch push permits the first PR run without changing main.
  push:
    branches: [codex/video-discovery]
    paths:
      - .github/workflows/gallery-final-comparison.yml
      - performance/gallery-final/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gallery-final-comparison-${{ github.ref }}
  cancel-in-progress: false

jobs:
  paired-comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CI: '1'
      NEXT_TELEMETRY_DISABLED: '1'
      FIXTURE_DATABASE_URL: postgresql://postgres:fixture@127.0.0.1:5432/postgres
      DATABASE_URL: postgresql://postgres:fixture@127.0.0.1:5432/postgres?options=-c%20default_transaction_read_only%3Don
      NEXT_PUBLIC_SUPABASE_URL: https://fixture.invalid
      NEXT_PUBLIC_SUPABASE_ANON_KEY: fixture-anon-key
      EXAMPLES_PLAYLIST_SLUG: examples
      INDEXABLE_PLAYLIST_SLUGS: examples
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v5
        with:
          path: candidate
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Checkout pinned integrated main baseline
        uses: actions/checkout@v5
        with:
          path: baseline
          ref: 0c6572d8ff43803b7a7024f6c4c854b96d932953
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.18.2 --activate

      - name: Setup Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable

      - name: Record Chrome executable
        run: echo "CHROME_PATH=${{ steps.chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"

      - name: Verify pinned source and frozen fixture
        run: |
          mkdir -p gallery-results
          test "$(git -C baseline rev-parse HEAD)" = 0c6572d8ff43803b7a7024f6c4c854b96d932953
          test "$(git -C candidate rev-parse HEAD)" = "$GITHUB_SHA"
          git -C candidate diff --quiet 6d406f497aa4db6b42153e33139554915d95f48d HEAD -- frontend neon/migrations scripts package.json pnpm-lock.yaml
          python3 candidate/performance/gallery-final/run.py --verify-only
          python3 -m unittest discover -s candidate/performance/gallery-final -p test_runner.py
          node --version > gallery-results/tool-versions.txt
          pnpm --version >> gallery-results/tool-versions.txt
          "$CHROME_PATH" --version >> gallery-results/tool-versions.txt
          git -C candidate rev-parse HEAD > gallery-results/candidate-commit.txt
          git -C baseline rev-parse HEAD > gallery-results/baseline-commit.txt

      - name: Install baseline dependencies
        working-directory: baseline
        run: pnpm install --frozen-lockfile

      - name: Install candidate dependencies
        working-directory: candidate
        run: pnpm install --frozen-lockfile

      - name: Seed disposable PostgreSQL fixture
        working-directory: candidate
        run: pnpm exec tsx --tsconfig frontend/tsconfig.json performance/gallery-final/seed-fixture.ts | tee ../gallery-results/seed.log

      - name: Build pinned baseline
        working-directory: baseline
        run: pnpm --dir frontend exec next build > ../gallery-results/baseline-build.log 2>&1 || { cat ../gallery-results/baseline-build.log; exit 1; }

      - name: Build candidate
        working-directory: candidate
        run: pnpm --dir frontend exec next build > ../gallery-results/candidate-build.log 2>&1 || { cat ../gallery-results/candidate-build.log; exit 1; }

      - name: Measure cold and warm mobile and desktop, then First Play
        run: >-
          python3 candidate/performance/gallery-final/run.py
          --baseline baseline
          --candidate candidate
          --candidate-commit "$GITHUB_SHA"
          --output gallery-results

      - name: Upload raw and summarized evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: gallery-final-paired-${{ github.run_id }}
          path: gallery-results/**
          if-no-files-found: warn
          retention-days: 7
