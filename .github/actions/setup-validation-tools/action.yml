name: Setup validation tools
description: Install FFmpeg and PostgreSQL 17 for disposable integration fixtures.
runs:
  using: composite
  steps:
    - name: Select official Ubuntu archive transport
      shell: bash
      run: |
        . /etc/os-release
        ubuntu_archive_url=''
        # Kernel.org's Ubuntu mirror is a final fallback when Ubuntu DNS is unavailable.
        # APT still verifies the original Ubuntu archive signatures and package hashes.
        for candidate in https://archive.ubuntu.com/ubuntu https://azure.archive.ubuntu.com/ubuntu https://mirrors.edge.kernel.org/ubuntu; do
          if http_status="$(curl --fail --silent --show-error --connect-timeout 5 --max-time 15 \
            "$candidate/dists/${VERSION_CODENAME:?}/InRelease" --output /dev/null --write-out '%{http_code}')" \
            && [ "$http_status" = 200 ]; then
            ubuntu_archive_url="$candidate"
            break
          fi
        done
        if [ -z "$ubuntu_archive_url" ]; then
          echo 'No official Ubuntu archive is reachable from this runner.' >&2
          exit 1
        fi
        echo "Using reachable Ubuntu archive: $ubuntu_archive_url"
        sudo python3 - "$ubuntu_archive_url" <<'PYTHON'
        from pathlib import Path
        import re
        import sys

        archive_url = sys.argv[1]
        if archive_url not in (
            'https://archive.ubuntu.com/ubuntu',
            'https://azure.archive.ubuntu.com/ubuntu',
            'https://mirrors.edge.kernel.org/ubuntu',
        ):
            raise ValueError('Unsupported Ubuntu archive')

        # Change only the known Ubuntu transport endpoint, retaining suites and signing keys.
        for source in (
            Path('/etc/apt/apt-mirrors.txt'),
            Path('/etc/apt/security-mirrors.txt'),
            Path('/etc/apt/sources.list'),
            Path('/etc/apt/sources.list.d/ubuntu.sources'),
        ):
            if not source.is_file():
                continue
            original = source.read_text()
            updated = re.sub(
                r'https?://(?:azure\.)?archive\.ubuntu\.com/ubuntu(?=/|\s|$)',
                archive_url,
                original,
            )
            if updated != original:
                source.write_text(updated)
                print(f'Ubuntu archive transport updated: {source}')
        PYTHON
    - name: Install media and database validation tools
      shell: bash
      run: |
        sudo timeout 5m apt-get update --error-on=any
        sudo apt-get install --yes --no-install-recommends ffmpeg postgresql-common
        sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
        sudo apt-get install --yes --no-install-recommends postgresql-17
        echo '/usr/lib/postgresql/17/bin' >> "$GITHUB_PATH"
        /usr/lib/postgresql/17/bin/postgres --version
        ffmpeg -hide_banner -version
