name: Setup project
description: Install the pinned Node and pnpm toolchain and frozen workspace dependencies.
runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '22'
        package-manager-cache: false
    - name: Enable Corepack
      shell: bash
      run: corepack enable
    - name: Install pnpm
      shell: bash
      run: corepack prepare pnpm@10.18.2 --activate
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
