<div id="studio-motion-study">
  <section class="studio-product" aria-label="Studio, étude de recomposition des créations">
    <header class="studio-appbar">
      <div class="studio-brand"><span class="studio-monogram">M</span><span>MaxVideoAI</span><i data-lucide="menu" aria-hidden="true"></i></div>
      <div class="studio-account"><span class="studio-study-label">Étude UX</span><span class="studio-connect">Connecter</span><i data-lucide="circle-user-round" aria-hidden="true"></i></div>
    </header>
    <div class="studio-shell">
      <nav class="studio-rail" aria-label="Navigation de l’application">
        <span><i data-lucide="grid-2x2" aria-hidden="true"></i>Créer</span>
        <span><i data-lucide="images" aria-hidden="true"></i>Médias</span>
        <span><i data-lucide="wand-sparkles" aria-hidden="true"></i>Outils</span>
        <span class="studio-nav-active" aria-current="page"><i data-lucide="clapperboard" aria-hidden="true"></i>Studio</span>
        <span><i data-lucide="list-filter" aria-hidden="true"></i>Activité</span>
        <span class="studio-nav-account"><i data-lucide="user-round" aria-hidden="true"></i>Compte</span>
      </nav>
      <main class="studio-workspace">
        <div class="studio-title-row"><h1>Studio</h1><span>Film parfum</span><button type="button" class="studio-small-status cursor-interaction" data-count aria-label="Voir toutes les créations">3 créations</button></div>
        <div class="studio-stage">
          <div class="studio-media-layer" aria-label="Créations du projet"></div>
          <section class="studio-chat" aria-label="Conversation avec Studio">
            <div class="studio-history" role="log" aria-label="Historique de la conversation" aria-live="polite">
              <h2 class="studio-intro">Une idée. <span>Un film.</span></h2>
              <div class="studio-messages"></div>
            </div>
            <button type="button" class="studio-new-reply cursor-interaction" hidden>Nouvelle réponse <i data-lucide="arrow-down" aria-hidden="true"></i></button>
            <form class="studio-composer">
              <button type="button" class="studio-plus cursor-interaction" aria-label="Ajouter un visuel"><i data-lucide="plus" aria-hidden="true"></i></button>
              <label class="studio-hidden" for="studio-motion-input">Votre demande à Studio</label>
              <input id="studio-motion-input" autocomplete="off" maxlength="280" placeholder="Décrivez votre idée…">
              <button type="submit" class="studio-send cursor-interaction" aria-label="Envoyer la demande"><i data-lucide="arrow-up" aria-hidden="true"></i></button>
            </form>
          </section>
          <button type="button" class="studio-reserve cursor-interaction" hidden><i data-lucide="layers-2" aria-hidden="true"></i><span></span></button>
          <button type="button" class="studio-pin cursor-interaction" aria-pressed="false" aria-label="Garder le visuel principal à l’écran"><i data-lucide="pin" aria-hidden="true"></i><span>Garder à l’écran</span></button>
        </div>
        <section class="studio-film" aria-label="Montage : déplacer et raccourcir les plans">
          <div class="studio-film-meta">
            <button type="button" class="studio-montage-toggle cursor-interaction" aria-expanded="false" aria-controls="studio-montage-editor"><i data-lucide="clapperboard" aria-hidden="true"></i><span>Montage</span><i class="studio-montage-chevron" data-lucide="chevron-up" aria-hidden="true"></i></button>
            <span class="studio-animatic-label">Animatique</span><span class="studio-time">0:00 / 1:00</span><button type="button" class="studio-undo cursor-interaction" hidden>Annuler</button>
          </div>
          <div class="studio-film-body" id="studio-montage-editor">
            <div class="studio-transport">
              <button type="button" class="studio-play cursor-interaction" aria-label="Lire l’animatique" aria-pressed="false"><i data-lucide="play" aria-hidden="true"></i></button>
              <div class="studio-zoom"><button type="button" class="cursor-interaction" data-zoom="out" aria-label="Réduire la timeline"><i data-lucide="minus" aria-hidden="true"></i></button><button type="button" class="cursor-interaction" data-zoom="in" aria-label="Agrandir la timeline"><i data-lucide="plus" aria-hidden="true"></i></button></div>
            </div>
            <div class="studio-timeline-scroll" aria-label="Timeline défilante">
              <div class="studio-sequence">
                <div class="studio-clips"></div>
                <div class="studio-ruler" aria-label="Déplacer la tête de lecture"></div>
                <div class="studio-playhead" aria-hidden="true"><span></span></div>
                <div class="studio-drop-marker" hidden aria-hidden="true"></div>
              </div>
            </div>
          </div>
          <div class="studio-selection" hidden>
            <span class="studio-selection-name"></span>
            <div class="studio-selection-actions">
              <button type="button" class="cursor-interaction" data-move="left" aria-label="Déplacer le plan vers la gauche"><i data-lucide="arrow-left" aria-hidden="true"></i></button>
              <button type="button" class="cursor-interaction" data-move="right" aria-label="Déplacer le plan vers la droite"><i data-lucide="arrow-right" aria-hidden="true"></i></button>
              <button type="button" class="studio-trim-toggle cursor-interaction" aria-expanded="false" aria-controls="studio-trim-panel"><i data-lucide="scissors" aria-hidden="true"></i>Couper</button>
            </div>
          </div>
          <div class="studio-trim-panel" id="studio-trim-panel" hidden>
            <div class="studio-trim-preview"><img alt="Aperçu du plan sélectionné"><span class="studio-trim-preview-time"></span></div>
            <div class="studio-trim-fields">
              <label><span>Début <output data-trim-value="in"></output></span><input type="range" data-trim="in" min="0" step="0.1" aria-label="Début du plan"></label>
              <label><span>Fin <output data-trim-value="out"></output></span><input type="range" data-trim="out" min="0.5" step="0.1" aria-label="Fin du plan"></label>
            </div>
          </div>
        </section>
      </main>
    </div>
    <dialog class="studio-drawer" aria-label="Toutes les créations du projet">
      <div class="studio-drawer-header"><h2>Les créations</h2><button type="button" class="studio-close cursor-interaction" aria-label="Fermer les créations"><i data-lucide="x" aria-hidden="true"></i></button></div>
      <div class="studio-drawer-grid"></div>
    </dialog>
    <dialog class="studio-mobile-preview" aria-label="Aperçu d’une création">
      <div class="studio-drawer-header"><span class="studio-preview-name"></span><button type="button" class="studio-close-preview studio-close cursor-interaction" aria-label="Fermer l’aperçu"><i data-lucide="x" aria-hidden="true"></i></button></div>
      <img alt="Création du projet">
    </dialog>
    <p class="studio-hidden" data-announcement role="status" aria-live="polite"></p>
  </section>
  <div class="viz-controls" aria-label="Moments à explorer">
    <button type="button" class="btn btn-primary" data-demo="add">Ajouter un visuel</button>
    <button type="button" class="btn" data-demo="many">8 créations</button>
    <button type="button" class="btn" data-demo="chat">Conversation longue</button>
  </div>
</div>
<style>

#studio-motion-study .studio-drawer::backdrop{background:#0008}
#studio-motion-study .studio-drawer-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
#studio-motion-study .studio-drawer-header h2{font-size:18px;font-weight:500;margin:0}
#studio-motion-study .studio-close{width:34px;height:34px;display:grid;place-items:center;background:var(--studio-surface);border:0;border-radius:50%}
#studio-motion-study .studio-drawer-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
#studio-motion-study .studio-asset-choice{border:0;background:transparent;padding:0;text-align:left;font-size:11px}
#studio-motion-study .studio-asset-choice img{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:5px;display:block;margin-bottom:5px}
#studio-motion-study .studio-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}
@keyframes studio-message-in{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){#studio-motion-study .studio-product *{animation:none!important;transition:none!important}}
@media(max-width:760px){#studio-motion-study .studio-shell{display:block}#studio-motion-study .studio-rail{display:none}#studio-motion-study .studio-appbar{padding:0 14px}#studio-motion-study .studio-brand{gap:10px}#studio-motion-study .studio-connect{display:none}#studio-motion-study .studio-workspace{padding:17px 14px}#studio-motion-study .studio-stage{height:490px}#studio-motion-study .studio-chat{left:0;right:0;width:auto;top:0;bottom:18px}#studio-motion-study .studio-intro{margin:24px 0 25px;font-size:23px}#studio-motion-study .studio-message{font-size:13px;max-width:95%}#studio-motion-study .studio-media-layer,#studio-motion-study .studio-pin,#studio-motion-study .studio-reserve{display:none}#studio-motion-study .studio-composer input{font-size:16px}#studio-motion-study .studio-title-row h1{font-size:23px}#studio-motion-study .studio-title-row{gap:9px}#studio-motion-study .studio-small-status{display:none}#studio-motion-study .studio-turn-assets{display:flex;gap:6px;margin-top:12px;overflow-x:auto}#studio-motion-study .studio-turn-assets button{padding:0;border:0;background:transparent;border-radius:6px;overflow:hidden;min-width:0;flex:1}#studio-motion-study .studio-turn-assets img{display:block;width:100%;height:140px;object-fit:cover}#studio-motion-study .studio-turn-assets button:only-child img{height:190px}#studio-motion-study .studio-montage-chevron{display:block}#studio-motion-study .studio-montage-toggle{height:34px}#studio-motion-study .studio-film-meta{padding-bottom:0;gap:8px}#studio-motion-study .studio-film:not(.is-montage-open) .studio-film-body,#studio-motion-study .studio-film:not(.is-montage-open) .studio-selection,#studio-motion-study .studio-film:not(.is-montage-open) .studio-trim-panel,#studio-motion-study .studio-film:not(.is-montage-open) .studio-undo{display:none}#studio-motion-study .studio-film.is-montage-open .studio-film-body{margin-top:8px}#studio-motion-study .studio-film-body{gap:9px}#studio-motion-study .studio-selection,#studio-motion-study .studio-trim-panel{margin-left:0}#studio-motion-study .studio-selection{gap:6px;flex-wrap:wrap}#studio-motion-study .studio-clip-main{touch-action:pan-x}#studio-motion-study .studio-trim-handle{display:none!important}#studio-motion-study .studio-selection-actions button{min-height:44px;min-width:44px}#studio-motion-study .studio-trim-panel{gap:10px}#studio-motion-study .studio-trim-preview{width:88px;aspect-ratio:3/4}#studio-motion-study .studio-trim-fields input{height:30px}#studio-motion-study .studio-grip{width:44px;height:44px}#studio-motion-study .studio-clip-name{left:5px}#studio-motion-study .studio-animatic-label{display:none}}
@media(max-width:420px){#studio-motion-study .studio-title-row>span{font-size:11px}#studio-motion-study .studio-brand{font-size:12px}#studio-motion-study .studio-account{gap:8px}#studio-motion-study .studio-study-label{font-size:11px}#studio-motion-study .studio-drawer-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(pointer:coarse){#studio-motion-study .studio-product button{min-height:44px}#studio-motion-study .studio-plus,#studio-motion-study .studio-send{width:40px}#studio-motion-study .studio-composer{height:54px}#studio-motion-study .studio-trim-handle{display:none!important}#studio-motion-study .studio-grip{width:44px;height:44px}#studio-motion-study .studio-timeline-scroll{touch-action:pan-x}}

  const photoNames=['Flacon et lumière','Geste et flacon','Reflets dans le verre'];

  function applySaved(saved){

    state.selected=Math.min(state.count-1,Math.max(0,Number.isInteger(p.selected)?p.selected:state.count-1));

      const grip=document.createElement('button');grip.type='button';grip.className='studio-grip cursor-interaction';grip.setAttribute('aria-label',`Déplacer le plan ${c.id+1}`);grip.innerHTML='<i data-lucide="grip-vertical" aria-hidden="true"></i>';grip.addEventListener('pointerdown',event=>beginMove(event,c.id,grip,clip));grip.addEventListener('keydown',event=>{if(['ArrowLeft','ArrowRight'].includes(event.key)){event.preventDefault();moveClip(c.id,event.key==='ArrowLeft'?-1:1);}});clip.append(grip);
      ['in','out'].forEach(edge=>{const handle=document.createElement('button');handle.type='button';handle.className='studio-trim-handle';handle.dataset.edge=edge;handle.setAttribute('aria-label',`${edge==='in'?'Couper le début':'Couper la fin'} du plan ${c.id+1}`);handle.addEventListener('pointerdown',event=>beginTrim(event,c.id,edge,handle));handle.addEventListener('keydown',event=>{if(['ArrowLeft','ArrowRight'].includes(event.key)){event.preventDefault();rememberEdit();trimClip(c.id,edge,c[edge]+(event.key==='ArrowRight'?.1:-.1));updateTimelineGeometry();persist();}});clip.append(handle);});

    });
    root.querySelector('.studio-ruler').replaceChildren();[0,.25,.5,.75,1].forEach(r=>{const span=document.createElement('span');span.dataset.ratio=String(r);root.querySelector('.studio-ruler').append(span);});
    updateTimelineGeometry();
    if(!window.matchMedia('(prefers-reduced-motion:reduce)').matches)clips.querySelectorAll('.studio-clip').forEach(node=>{const left=previous.get(Number(node.dataset.clipId));if(left!==undefined){const delta=left-node.getBoundingClientRect().left;if(Math.abs(delta)>1)node.animate([{transform:`translateX(${delta}px)`},{transform:'translateX(0)'}],{duration:300,easing:'ease-out'});}});
    if(globalThis.lucide)lucide.createIcons();

  function updateTimelineGeometry(){
    root.querySelector('.studio-sequence').style.width=`${trackWidth()}px`;
    root.querySelectorAll('.studio-clip').forEach(node=>{const c=state.clips.find(c=>c.id===Number(node.dataset.clipId));const d=c.out-c.in;node.style.width=`${d*pixelsPerSecond()}px`;node.classList.toggle('is-selected',c.id===state.timelineSelected);const b=node.querySelector('.studio-clip-main');b.setAttribute('aria-label',`Plan ${c.id+1}, ${Number(d.toFixed(1))} secondes${c.id>=state.count?', à créer':''}`);b.setAttribute('aria-pressed',String(c.id===state.timelineSelected));node.querySelector('.studio-clip-duration').textContent=`${Number(d.toFixed(1))} s`;node.querySelector('.studio-clip-duration').hidden=d*pixelsPerSecond()<45;node.querySelectorAll('.studio-trim-handle').forEach(h=>{h.style.visibility=d*pixelsPerSecond()<44?'hidden':'';});});
    root.querySelectorAll('.studio-ruler span').forEach(span=>{const t=total()*Number(span.dataset.ratio);span.textContent=formatTime(t);span.style.left=`${timelinePixel(t)}px`;});
    root.querySelector('.studio-undo').hidden=undoHistory.length===0;
    const mobile=window.matchMedia('(max-width:760px)').matches;product.classList.toggle('is-mobile',mobile);root.querySelector('.studio-film').classList.toggle('is-montage-open',state.montageOpen);const montageToggle=root.querySelector('.studio-montage-toggle');montageToggle.setAttribute('aria-expanded',String(mobile?state.montageOpen:true));montageToggle.disabled=!mobile;
    const selection=root.querySelector('.studio-selection');selection.hidden=false;const c=currentClip();selection.querySelector('.studio-selection-name').textContent=`Plan ${c.id+1} · ${Number((c.out-c.in).toFixed(1))} s`;const i=state.clips.indexOf(c);root.querySelector('[data-move="left"]').disabled=i===0;root.querySelector('[data-move="right"]').disabled=i===state.clips.length-1;
    root.querySelector('.studio-trim-toggle').setAttribute('aria-expanded',String(state.trimOpen));root.querySelector('.studio-trim-panel').hidden=!state.trimOpen;
    root.querySelector('.studio-trim-preview img').src=source(c.id);root.querySelector('.studio-trim-preview img').alt=`Aperçu du plan ${c.id+1}`;
    const start=root.querySelector('[data-trim="in"]'),end=root.querySelector('[data-trim="out"]');start.max=String(c.out-.5);start.value=String(c.in);end.max=String(c.sourceDuration);end.min=String(c.in+.5);end.value=String(c.out);root.querySelector('[data-trim-value="in"]').textContent=fineTime(c.in);root.querySelector('[data-trim-value="out"]').textContent=fineTime(c.out);root.querySelector('.studio-trim-preview-time').textContent=`${Number((c.out-c.in).toFixed(1))} s`;
    updatePlayhead();
  }
  function revealClip(){const scroll=root.querySelector('.studio-timeline-scroll'),clip=root.querySelector(`.studio-clip[data-clip-id="${state.timelineSelected}"]`);if(!clip||!scroll.clientWidth)return;const left=clip.offsetLeft,right=left+clip.offsetWidth;if(right>scroll.scrollLeft+scroll.clientWidth)scroll.scrollLeft=Math.max(0,right-scroll.clientWidth+12);else if(left<scroll.scrollLeft)scroll.scrollLeft=Math.max(0,left-12);}
  function selectClip(id){stopPlayback();state.timelineSelected=id;if(id<state.count&&!state.pinned)state.selected=id;playTime=0;for(const c of state.clips){if(c.id===id)break;playTime+=c.out-c.in;}layoutMedia();updateTimelineGeometry();revealClip();persist();announce(`Plan ${id+1} sélectionné. Déplacez-le ou ajustez sa coupe.`);}
  function moveClip(id,direction){const i=state.clips.findIndex(c=>c.id===id);reorderClip(id,Math.max(0,Math.min(state.clips.length-1,i+direction)));}
  function reorderClip(id,index){const previous=state.clips.findIndex(c=>c.id===id);if(previous===index)return;stopPlayback();rememberEdit();const [c]=state.clips.splice(previous,1);state.clips.splice(index,0,c);state.timelineSelected=id;playTime=state.clips.slice(0,index).reduce((sum,item)=>sum+item.out-item.in,0);renderTimeline();revealClip();persist();announce(`Plan ${id+1} placé en position ${index+1}.`);}
  function beginMove(event,id,handle,clip){
    if(event.button!==0)return;event.preventDefault();stopPlayback();const marker=root.querySelector('.studio-drop-marker');const sequence=root.querySelector('.studio-sequence');let index=state.clips.findIndex(c=>c.id===id);handle.setPointerCapture(event.pointerId);clip.classList.add('is-dragging');
    const move=e=>{const scroll=root.querySelector('.studio-timeline-scroll'),rect=scroll.getBoundingClientRect();if(e.clientX<rect.left+25)scroll.scrollLeft-=14;else if(e.clientX>rect.right-25)scroll.scrollLeft+=14;const others=Array.from(root.querySelectorAll('.studio-clip')).filter(n=>Number(n.dataset.clipId)!==id);index=others.filter(n=>e.clientX>n.getBoundingClientRect().left+n.getBoundingClientRect().width/2).length;const target=others[index];marker.hidden=false;marker.style.left=`${target?target.getBoundingClientRect().left-sequence.getBoundingClientRect().left:trackWidth()}px`;};
    const finish=e=>{handle.removeEventListener('pointermove',move);handle.removeEventListener('pointerup',finish);handle.removeEventListener('pointercancel',cancel);if(handle.hasPointerCapture(e.pointerId))handle.releasePointerCapture(e.pointerId);clip.classList.remove('is-dragging');marker.hidden=true;reorderClip(id,index);};

    handle.addEventListener('pointermove',move);handle.addEventListener('pointerup',finish);handle.addEventListener('pointercancel',cancel);
  }
  function trimClip(id,edge,value){const c=state.clips.find(c=>c.id===id);c[edge]=Math.round(Math.max(edge==='in'?0:c.in+.5,Math.min(edge==='in'?c.out-.5:c.sourceDuration,value))*10)/10;state.timelineSelected=id;syncShortened();playTime=Math.min(playTime,total());}
  function beginTrim(event,id,edge,handle){
    if(event.button!==0)return;event.preventDefault();stopPlayback();const c=state.clips.find(c=>c.id===id),initial=c[edge],x=event.clientX,scale=pixelsPerSecond();let changed=false;handle.setPointerCapture(event.pointerId);state.trimOpen=true;
    const move=e=>{if(!changed&&Math.abs(e.clientX-x)>1){rememberEdit();changed=true;}if(changed){trimClip(id,edge,initial+(e.clientX-x)/scale);updateTimelineGeometry();}};
    const finish=e=>{handle.removeEventListener('pointermove',move);handle.removeEventListener('pointerup',finish);handle.removeEventListener('pointercancel',finish);if(handle.hasPointerCapture(e.pointerId))handle.releasePointerCapture(e.pointerId);updateTimelineGeometry();persist();if(changed)announce(`Plan ${id+1}, ${Number((c.out-c.in).toFixed(1))} secondes.`);};
    handle.addEventListener('pointermove',move);handle.addEventListener('pointerup',finish);handle.addEventListener('pointercancel',finish);
  }
  function undoEdit(){if(!undoHistory.length)return;stopPlayback();const previous=undoHistory.pop();state.clips=previous.clips.map(c=>({...c}));state.timelineSelected=previous.selected;playTime=previous.time;syncShortened();renderTimeline();persist();announce('La dernière modification du montage est annulée.');}
  function updatePlayhead(){const t=Math.min(playTime,total());const duration=Number(total().toFixed(1));root.querySelector('.studio-time').textContent=`${formatTime(t)} / ${Number.isInteger(duration)?formatTime(duration):fineTime(duration)}`;root.querySelector('.studio-playhead').style.left=`${timelinePixel(t)}px`;}
  function stopPlayback(){playing=false;if(playFrame!==null)cancelAnimationFrame(playFrame);playFrame=null;const button=root.querySelector('.studio-play');button.setAttribute('aria-pressed','false');button.setAttribute('aria-label','Lire l’animatique');button.innerHTML='<i data-lucide="play" aria-hidden="true"></i>';if(globalThis.lucide)lucide.createIcons();}
  function tick(now){
    if(!playing)return;playTime+=(now-lastTick)/1000;lastTick=now;
    if(playTime>=total()){playTime=total();updatePlayhead();stopPlayback();return;}
    let end=0,current=state.clips[0];for(const c of state.clips){current=c;end+=c.out-c.in;if(playTime<end)break;}

    updatePlayhead();const scroll=root.querySelector('.studio-timeline-scroll'),pixel=timelinePixel(playTime);if(pixel>scroll.scrollLeft+scroll.clientWidth-12||pixel<scroll.scrollLeft)scroll.scrollLeft=Math.max(0,pixel-.7*scroll.clientWidth);playFrame=requestAnimationFrame(tick);
  }
  function addVisual(text='Crée une nouvelle image, dans la même lumière.'){
    stopPlayback();if(state.count>=12){announce('La réserve contient déjà les douze créations de cette étude.');openReserve();return;}
    addMessage('user',text);state.count++;if(!state.pinned)state.selected=state.count-1;
    renderMedia();renderTimeline();addMessage('assistant',state.pinned?'Le nouveau visuel rejoint les créations. Votre aperçu reste à l’écran.':'Voici le nouveau visuel. Les précédents restent à portée de main.',[state.count-1]);persist();announce(`Création ${state.count} ajoutée. ${Math.max(0,state.count-4)} créations dans la réserve.`);
  }
  function longConversation(){
    stopPlayback();atBottom=true;state.messages=initialMessages.slice();
    const exchanges=[['Plus de lumière sur le verre.','Je travaille les reflets en gardant le même flacon.'],['Garde ce cadrage.','Ce cadrage devient la référence.'],['Un geste plus naturel.','Je propose un plan plus intime.'],['Moins de contraste.','La lumière est adoucie.'],['Ajoute un plan de détail.','Voici le détail du verre.'],['Garde le bleu.','La couleur reste cohérente entre les plans.'],['Et la fin du film ?','Le dernier plan revient au flacon.'],['Un peu plus de silence.','La respiration du montage est ajustée.'],['Montre-moi les images précédentes.','Elles restent accessibles dans les créations.'],['Raccourcis le deuxième plan à 4 secondes.','Le deuxième plan passe à 4 secondes.']];
    exchanges.forEach(([u,a],i)=>state.messages.push({role:'user',text:u},{role:'assistant',text:a,assets:i===9?[1]:[0,2,4].includes(i)?[i%3]:[]}));rememberEdit();state.clips=baseClips();state.clips[1].out=4;state.shortened=true;state.timelineSelected=1;if(!state.pinned)state.selected=1;playTime=15;layoutMedia();renderMessages();renderTimeline();revealClip();persist();announce('Conversation de vingt-deux messages, saisie conservée à la même place.');
  }
  function openReserve(){
    const grid=root.querySelector('.studio-drawer-grid');grid.replaceChildren();
    for(let id=0;id<state.count;id++){const b=document.createElement('button');b.type='button';b.className='studio-asset-choice cursor-interaction';const img=document.createElement('img');img.src=source(id);img.alt=photoNames[id%3];const label=document.createElement('span');label.textContent=`Création ${String(id+1).padStart(2,'0')}`;b.append(img,label);b.addEventListener('click',()=>{stopPlayback();state.selected=id;drawer.close();layoutMedia();renderTimeline();persist();if(window.matchMedia('(max-width:760px)').matches)showCreation(id,true);});grid.append(b);}drawer.showModal();
  }
  function showCreation(id,fromReserve=false){previewReturn=fromReserve?root.querySelector('[data-count]'):document.activeElement;preview.querySelector('img').src=source(id);preview.querySelector('img').alt=photoNames[id%3];preview.querySelector('.studio-preview-name').textContent=`Création ${id+1}`;preview.showModal();}
  root.querySelector('.studio-composer').addEventListener('submit',event=>{
    event.preventDefault();const text=input.value.trim();if(!text)return;input.value='';
    if(/raccourci|4 secondes|4 s\b/i.test(text)){stopPlayback();addMessage('user',text);rememberEdit();const c=state.clips.find(c=>c.id===1);c.in=0;c.out=4;state.shortened=true;state.timelineSelected=1;if(!state.pinned)state.selected=1;playTime=state.clips.slice(0,state.clips.indexOf(c)).reduce((sum,item)=>sum+item.out-item.in,0);layoutMedia();renderTimeline();revealClip();addMessage('assistant',`Le plan 2 passe à 4 secondes. Le film dure maintenant ${Number(total().toFixed(1))} secondes.`,[1]);persist();}
    else if(/annul/i.test(text)&&undoHistory.length){undoEdit();addMessage('user',text);addMessage('assistant','La dernière modification du montage est annulée.');persist();}
    else addVisual(text);
  });
  root.querySelector('.studio-plus').addEventListener('click',()=>addVisual());
  root.querySelector('[data-demo="add"]').addEventListener('click',()=>addVisual());
  root.querySelector('[data-demo="many"]').addEventListener('click',()=>{stopPlayback();state.count=Math.max(8,state.count);state.selected=state.pinned?Math.min(state.count-1,state.selected):state.count-1;addMessage('user','Propose quelques variations dans la même direction.');renderMedia();renderTimeline();addMessage('assistant','Les nouvelles variations arrivent. Les premières restent accessibles dans les créations.',[5,6,7]);persist();announce(`${state.count} créations, quatre visibles et les précédentes en réserve.`);});
  root.querySelector('[data-demo="chat"]').addEventListener('click',longConversation);
  root.querySelector('.studio-reserve').addEventListener('click',openReserve);
  root.querySelector('[data-count]').addEventListener('click',openReserve);
  drawer.querySelector('.studio-close').addEventListener('click',()=>drawer.close());
  root.querySelector('.studio-close-preview').addEventListener('click',()=>root.querySelector('.studio-mobile-preview').close());
  preview.addEventListener('close',()=>{if(previewReturn?.isConnected)previewReturn.focus({preventScroll:true});});
  root.querySelector('.studio-pin').addEventListener('click',()=>{state.pinned=!state.pinned;layoutMedia();persist();announce(state.pinned?'Le visuel principal reste à l’écran pendant les prochaines créations.':'Les prochaines créations peuvent passer au premier plan.');});
  root.querySelector('.studio-undo').addEventListener('click',undoEdit);
  root.querySelector('.studio-montage-toggle').addEventListener('click',()=>{if(!window.matchMedia('(max-width:760px)').matches)return;state.montageOpen=!state.montageOpen;updateTimelineGeometry();if(state.montageOpen)revealClip();persist();});
  root.querySelector('.studio-trim-toggle').addEventListener('click',()=>{state.trimOpen=!state.trimOpen;updateTimelineGeometry();persist();});
  root.querySelectorAll('[data-move]').forEach(button=>button.addEventListener('click',()=>moveClip(state.timelineSelected,button.dataset.move==='left'?-1:1)));
  root.querySelectorAll('[data-zoom]').forEach(button=>button.addEventListener('click',()=>{const scroll=root.querySelector('.studio-timeline-scroll');const anchor=timelineSeconds(scroll.scrollLeft+scroll.clientWidth/2);state.zoom=Math.max(.6,Math.min(8,state.zoom*(button.dataset.zoom==='in'?1.4:1/1.4)));updateTimelineGeometry();scroll.scrollLeft=Math.max(0,timelinePixel(anchor)-scroll.clientWidth/2);persist();}));
  root.querySelectorAll('[data-trim]').forEach(range=>{let editing=false;range.addEventListener('input',()=>{stopPlayback();if(!editing){rememberEdit();editing=true;}trimClip(state.timelineSelected,range.dataset.trim,Number(range.value));updateTimelineGeometry();});range.addEventListener('change',()=>{editing=false;persist();announce(`Plan ${currentClip().id+1}, ${Number((currentClip().out-currentClip().in).toFixed(1))} secondes.`);});});
  const ruler=root.querySelector('.studio-ruler');ruler.addEventListener('pointerdown',event=>{if(event.button!==0)return;event.preventDefault();stopPlayback();ruler.setPointerCapture(event.pointerId);const seek=e=>{playTime=Math.max(0,Math.min(total(),timelineSeconds(e.clientX-root.querySelector('.studio-sequence').getBoundingClientRect().left)));let end=0;for(const c of state.clips){end+=c.out-c.in;if(playTime<=end){state.timelineSelected=c.id;if(c.id<state.count&&!state.pinned)state.selected=c.id;break;}}layoutMedia();updateTimelineGeometry();};const finish=e=>{ruler.removeEventListener('pointermove',seek);ruler.removeEventListener('pointerup',finish);ruler.removeEventListener('pointercancel',finish);if(ruler.hasPointerCapture(e.pointerId))ruler.releasePointerCapture(e.pointerId);persist();};seek(event);ruler.addEventListener('pointermove',seek);ruler.addEventListener('pointerup',finish);ruler.addEventListener('pointercancel',finish);});
  history.addEventListener('scroll',()=>{if(historyWidth!==history.clientWidth){historyWidth=history.clientWidth;return;}atBottom=history.scrollHeight-history.scrollTop-history.clientHeight<32;if(atBottom)newReply.hidden=true;});
  newReply.addEventListener('click',()=>{history.scrollTop=history.scrollHeight;atBottom=true;newReply.hidden=true;});
